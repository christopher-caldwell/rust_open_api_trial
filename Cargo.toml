[package]
name = "utoipa_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
jsonwebtoken = "9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipauto = "0.2"

[dev-dependencies]
serde_json = "1"
tower = "0.5"
http-body-util = "0.1"
